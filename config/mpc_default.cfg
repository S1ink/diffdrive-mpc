# =============================================================================
# mpc_default.cfg  -  MPC parameter config file
#
# Pass to the simulator with:
#   ./build/sim_test --config config/mpc_default.cfg
#
# All values here match the compiled-in defaults from include/mpc/params.hpp.
# Uncomment and edit any line to override a default.
#
# Rules:
#   - Keys must match MPCParams field names exactly (case-sensitive).
#   - Values must be numeric (integers or floats).
#   - Lines beginning with '#' are comments.
#   - Inline comments after a value are also supported.
#   - Unknown keys are warned about and ignored.
# =============================================================================

# --- Prediction horizon -------------------------------------------------------
N                  = 24
dt                 = 0.05     # timestep [s]
feedback_delay_s   = 0.0      # latency compensation lookahead [s]

# --- Velocity / angular rate limits -------------------------------------------
v_max              = 2.5      # maximum forward velocity [m/s]
v_min              = -0.1     # maximum reverse velocity [m/s]
omega_max          = 1.5      # maximum angular rate [rad/s]

# --- Acceleration limits ------------------------------------------------------
a_max              = 1.0      # linear acceleration limit [m/s²]
alpha_max          = 5.0      # angular acceleration limit [rad/s²]

# --- Corridor / slack ---------------------------------------------------------
d_hard             = 0.05     # hard corridor half-width [m]
w_slack            = 100.0    # quadratic penalty on corridor slack

# --- Tracking / control costs -------------------------------------------------
Q_xy               = 20.0
Q_theta            = 20.0
Q_xy_terminal      = 50.0
Q_theta_terminal   = 30.0
R_v                = 0.0
R_omega            = 0.0
R_rate_v           = 3.0
R_rate_omega       = 3.0

# --- Funnel decay -------------------------------------------------------------
funnel_decay_tau   = 5.0      # how quickly widened corridor returns to d_hard

# --- Reference blending -------------------------------------------------------
blend_alpha        = 1.0      # 1.0 = use new reference only, 0.0 = keep old

# --- Stanley heading correction -----------------------------------------------
stanley_k          = 2.5
stanley_v_min      = 0.15
stanley_decay      = 0.15

# --- Near-goal detection ------------------------------------------------------
goal_threshold     = 0.01     # distance to goal to declare arrival [m]
goal_cte_scale     = 2.0
goal_stop_vel      = 0.01      # velocity under this to register stop [m/s]

# --- Solver fallback ----------------------------------------------------------
fallback_decay     = 0.8      # velocity decay multiplier on OSQP failure
